<!doctype html>
<html lang="ja"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="referrer" content="no-referrer"/><title>FRB Launch オプション設定</title>
<link rel="stylesheet" href="/editor.css"/><script type="module" src="/editor.js"></script>
</head><body>
<div class="container">
  <header><div class="brand"><span class="leaf">◢</span><div><h1>オプション設定</h1><small>FRB Launch ・ Studio Family Generic Editor</small></div></div><span class="status" id="status">起動中…</span></header>
  <nav id="option-buttons" aria-label="設定の選択"></nav>
  <main><div class="heading"><h2 id="form-title">設定を選択</h2><span class="info" id="ownership">System標準値</span></div>
  <p class="explain">ViewDefで公開された項目がユーザー管理対象です。表示条件で隠れた値も保持し、保存でUser領域に確定します。</p>
  <div id="fields"></div>
  <footer><p id="file-notice">変更内容はLaunch再起動後に反映される場合があります。</p>
  <button id="reset" type="button" class="muted">再読み込み</button>
  <button id="save" type="button" class="primary">保存して確定</button></footer></main>
</div>
</body></html>
