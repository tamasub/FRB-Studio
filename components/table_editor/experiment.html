<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>FRB Table Editor 実験</title><link rel="stylesheet" href="table_editor.css"><style>body{font:16px/1.6 system-ui,sans-serif;padding:24px;color:#28313e}pre{background:#f3f4f7;padding:12px;white-space:pre-wrap}</style></head><body><h1>FRB Table Editor — 単体実験</h1><p>MarkdownもCodeMirrorも使わない、行列データの編集部品。</p><div id="host"></div><pre id="value"></pre><script src="table_editor.js"></script><script>
const initial={rows:[['項目','値','備考'],['周波数','80 Hz','中域'],['ロッド','86ML','計測中']],align:['left','right','center']};
const snapshots=[initial];let index=0,grid;const host=document.querySelector('#host');function show(model,selection){grid?.closeMenu();host.replaceChildren();grid=new FRBTableEditor({model,selection,onChange:(value)=>{snapshots.splice(index+1);snapshots.push(value);index++;update();},onUndo:(redo,selection)=>{index=Math.max(0,Math.min(snapshots.length-1,index+(redo?1:-1)));show(snapshots[index],selection);grid.focus();},onSource:()=>{document.querySelector('#value').scrollIntoView();},onExit:()=>grid.root.blur()});grid.mount(host);update();}function update(){document.querySelector('#value').textContent=JSON.stringify(grid.getValue(),null,2);}show(initial);
</script></body></html>
