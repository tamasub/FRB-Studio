<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FRB Markdown Editor — 実験 v0.4</title>
<link rel="stylesheet" href="vendor/codemirror/codemirror.css"><link rel="stylesheet" href="markdown_editor.css"><link rel="stylesheet" href="../table_editor/table_editor.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f7;color:#28313e;font:14px/1.55 system-ui,"Yu Gothic UI",Meiryo,sans-serif}main{max-width:1250px;margin:auto;padding:24px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{font-size:23px;margin:0}p{margin:6px 0 14px;color:#68717e}button{font:inherit;border:1px solid #cfd3dc;border-radius:6px;background:#fff;color:inherit;padding:7px 12px;cursor:pointer}button[aria-pressed=true]{background:#eee7fb;border-color:#a68bd6;color:#563389}button:focus-visible{outline:2px solid #7954b3}nav{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0 14px}label{display:flex;gap:5px;align-items:center}section.layout{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:14px}.panel{border:1px solid #d9dce3;border-radius:9px;overflow:hidden;background:white;min-width:0}.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 13px;border-bottom:1px solid #e3e4ea;font-weight:650}.bar small{font-weight:400;color:#737987}#editor,#raw{height: min(68vh,720px);min-height:360px}#raw{display:block;width:100%;resize:none;border:none;outline:0;padding:15px;font:13px/1.65 Consolas,monospace;background:#fbfbfd;color:#4d5565;tab-size:4}footer{display:flex;flex-wrap:wrap;gap:14px;color:#68717e;margin:12px 0}#status[data-dirty=true]{color:#995421}#status[data-dirty=false]{color:#33764c}body.dark{background:#17191f;color:#e0e3eb}body.dark .panel,body.dark button{background:#202229;border-color:#464955}body.dark .bar{border-color:#464955}body.dark #raw{background:#23252c;color:#ddd}body.dark p,body.dark footer,body.dark .bar small{color:#a8adbb}@media(max-width:760px){main{padding:12px}section.layout{grid-template-columns:1fr}#raw{height:250px;min-height:0}}
</style></head><body><main>
<header><h1>FRB Markdown Editor <small style="font-size:12px;color:#7954b3">実験 v0.4</small></h1><span id="status" data-dirty="false">原文変更なし</span></header>
<p>左側でカーソルを移動・編集して、右側のMarkdown原文を確認。保存処理はありません。</p>
<nav><button id="live" aria-pressed="true">Live Preview</button><button id="source" aria-pressed="false">Source</button><button id="reset">サンプル復元</button><button id="qiita">Qiita構文サンプル</button><button id="basic">基本サンプル</button><button id="table">テーブル実験</button><button id="export">標準Markdownをコピー</button><button id="theme" aria-pressed="false">Dark</button><label><input type="checkbox" id="readonly">読み取り専用</label></nav>
<section class="layout"><div class="panel"><div class="bar">編集領域 <small>コンポーネント</small></div><div id="editor"></div></div><div class="panel"><div class="bar">getValue() <small>Markdown原文・読み取り専用</small></div><textarea id="raw" readonly spellcheck="false" aria-label="Markdown原文"></textarea></div></section>
<footer><span id="count"></span><span id="events">change: 0</span><span>Ctrl+Z / Ctrl+Y：Undo / Redo</span><span>外部通信なし</span></footer>
</main><script src="vendor/codemirror/codemirror.js"></script><script src="../table_editor/table_editor.js"></script><script src="markdown_editor.js"></script><script>
const sample = [
'# FRB Markdown Editor', '', '## 0. この文脈.mdの役割', '',
'普通の文章も、そのまま編集できます。', '本体は **世界のために公開する。**', 'ここは *斜体*、ここは ~~取り消し線~~、ここは `getValue()`。', '',
'- 何を大切にしているか', '- 何を実現したいか', '  - 小さな成功を増幅する', '',
'> JSONで思考を構造化し、AIとの文脈を育てる。', '',
'## コンポーネントの階層', '', '```text', 'FRB_Apps/', '└── FRB_Studio/', '    └── components/', '        └── markdown_editor/', '```', '',
'最後の行も編集できます。', ''
].join('\n');
const qiitaSample = "# Qiita構文・FRB拡張の実験\n\n```ruby:qiita.rb\nputs 'The best way to log and share programmers knowledge.'\n```\n\n`puts 'Qiita'` と書くことでインライン表示することも可能です。\n\n`#ffce44`\n`rgb(255,0,0)`\n`rgba(0,255,0,0.4)`\n`hsl(100, 10%, 10%)`\n`hsla(100, 24%, 40%, 0.5)`\n\n# これはH1タグです\n## これはH2タグです\n###### これはH6タグです\n\n_ か * で囲むとHTMLのemタグになります。Qiitaでは *italic type* になります。\n__ か ** で囲むとHTMLのstrongタグになります。Qiitaでは **太字** になります。\n__太字__ と _斜体_ も確認します。\n\n打ち消し線を使うには ~~ で囲みます。 ~~打ち消し~~\n\n<!-- open属性なし -->\n<details><summary>サンプルコード（open属性なし）</summary>\n\n(上に空行が必要)\n\n```rb\nputs 'Hello, World'\n```\n</details>\n\n<!-- open属性あり -->\n<details open><summary>サンプルコード（open属性あり）</summary>\n\n(上に空行が必要)\n\n```rb\nputs 'Hello, World'\n```\n</details>\n\n:::note info\nインフォメーション\ninfoは省略可能です。\n:::\n\n:::note warn\n警告\n○○に注意してください。\n:::\n\n:::note alert\nより強い警告\n○○しないでください。\n:::\n\n3\\. リスト\nエスケープされています\n\n<dl>\n  <dt>リンゴ</dt>\n  <dd>赤いフルーツ</dd>\n  <dt>オレンジ</dt>\n  <dd>橙色のフルーツ</dd>\n</dl>\n\n<dl>\n  <dt>リンゴ</dt>\n  <dd> とても<strong>赤い</strong>フルーツ </dd>\n</dl>\n\n- [ ] タスク1\n- [x] タスク2\n\n* * *\n***\n*****\n- - -\n---------------------------------------\n\n[リンクテキスト](URL \"タイトル\")\n\n[Qiita](http://qiita.com)\n\n## 追加の実験：テーブル\n\n| 項目 | 値 | 備考 |\n| :--- | ---: | :---: |\n| 周波数 | 80 Hz | 中域 |\n| ロッド | 86ML | 計測中 |\n| パイプ | A\\|B | `code` |\n\n## Mermaid（原文編集のみ）\n\n```mermaid\nflowchart TD\n  A[入力] --> B[FFT]\n  B --> C[可視化]\n```\n";
const tableSample = ['# テーブル編集の実験','', 'セルをクリックして選択。ダブルクリック / F2 / Enter で編集。Shift＋矢印またはドラッグで範囲選択。Ctrl+C / V / X、右クリックメニューも使えます。','', '| 項目 | 値 | 備考 |','| :--- | ---: | :---: |','| 周波数 | 80 Hz | 中域 |','| ロッド | 86ML | 計測中 |','| パイプ | A\\|B | `code` |','','表の外の文章も編集できます。',''].join('\n');
let baseline=sample;
const editor = new FRBMarkdownEditor({value:sample}); editor.mount(document.getElementById('editor'));
const raw=document.getElementById('raw'),status=document.getElementById('status');let changes=0;
function sync(){const value=editor.getValue();raw.value=value;status.dataset.dirty=String(value!==baseline);status.textContent=value===baseline?'原文変更なし':'原文変更あり';document.getElementById('count').textContent=`${value.length} UTF-16文字 / ${value.split(/\r\n|\r|\n/).length} 行`;document.getElementById('events').textContent=`change: ${changes}`;}
editor.on('change',()=>{changes++;sync();});
function mode(value){editor.setMode(value);document.getElementById('live').setAttribute('aria-pressed',String(value==='live-preview'));document.getElementById('source').setAttribute('aria-pressed',String(value==='source'));sync();editor.focus();}
document.getElementById('live').onclick=()=>mode('live-preview');document.getElementById('source').onclick=()=>mode('source');
function loadSample(value){if(editor.getValue()!==baseline&&!confirm('編集内容を破棄してサンプルを読み込みますか？'))return;baseline=value;editor.setValue(value);changes=0;sync();}
document.getElementById('reset').onclick=()=>loadSample(baseline);document.getElementById('qiita').onclick=()=>loadSample(qiitaSample);document.getElementById('basic').onclick=()=>loadSample(sample);document.getElementById('table').onclick=()=>loadSample(tableSample);
document.getElementById('export').onclick=async()=>{const text=editor.exportStandardMarkdown();try{await navigator.clipboard.writeText(text);document.getElementById('export').textContent='コピー済み';}catch{const tmp=document.createElement('textarea');tmp.value=text;document.body.append(tmp);tmp.select();const ok=document.execCommand('copy');tmp.remove();document.getElementById('export').textContent=ok?'コピー済み':'コピーできません（権限）';}};
document.getElementById('readonly').onchange=e=>editor.setReadOnly(e.target.checked);
document.getElementById('theme').onclick=e=>{const dark=document.body.classList.toggle('dark');editor.setTheme(dark?'dark':'light');e.currentTarget.setAttribute('aria-pressed',String(dark));};
window.addEventListener('resize',()=>editor.resize()); sync();
</script></body></html>
